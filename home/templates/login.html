{% extends 'principal.html' %}
{% load django_bootstrap5 %}
{% block main %}
    <div class="container-fluid">
            <section class="py-4">
                <div class="container">

                    <div class="row justify-content-center">
                        <div class="col-12 col-md-6 col-lg-5">

                            <div class="mb-4 text-center">
                                <h1 class="fw-bold mb-1 text-dark" style="font-size: 2.2rem;">{{ titulo }}</h1>
                            </div>

                            <div class="card shadow-sm border-light-subtle rounded-4 bg-white mb-5">
                                <div class="card-body p-4">
                                    <form method="POST" enctype="multipart/form-data">
                                        {% csrf_token %}

                                        <div class="mb-3 text-secondary fw-semibold">
                                            {% bootstrap_form form %}
                                        </div>

                                        <div class="d-flex justify-content-end gap-2">
                                            <a href="{% url 'index' %}" class="btn btn-light border fw-medium px-4 py-2 rounded-3 text-secondary shadow-sm">
                                               Cancelar
                                            </a>
                                            <button type="submit" class="btn text-white fw-bold px-4 py-2 rounded-3 shadow-sm" style="background-color: #ec9d32;">
                                                <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <div class="text-center mt-4">
                                <a href="{% url 'index' %}" class="text-decoration-none text-muted small">
                                    <i class="bi bi-arrow-left me-1"></i> Voltar para a página inicial
                                </a>
                            </div>

                        </div>
                    </div>

                </div>
            </section>
       </div>
    </div>
{% endblock %}
